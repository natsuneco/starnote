schema: spec-driven

context: |
  Write all OpenSpec artifacts (proposal.md, specs/**/*.md, design.md, tasks.md) in Japanese.
  OpenSpecのすべてのアーティファクト（提案、仕様、設計、タスクなど）は日本語で記述してください。

  【プロジェクト概要: StarNote】
  - iPad Safari（PWAスタンドアロン）で軽快に動作するGoodNotes/Collanoteライクな手書きノートWebアプリ。
  - 主な機能・アーキテクチャ要件:
    1. Apple Pencil最適化: PointerEvent (pressure/tilt) による筆圧・傾き検知、getCoalescedEvents と desynchronized: true による低遅延描画、perfect-freehand による滑らかなインク線生成。
    2. ジェスチャ操作: 幾何アルゴリズムによる「ぐちゃぐちゃ消去（Scribble to erase）」および「囲んで長押しによるなげなわ選択（Circle to lasso）」。
    3. PDF連携: pdfjs-dist による下敷き表示・閲覧、pdf-lib による手書き注釈合成エクスポート。
    4. ストレージ & 同期: IndexedDB (Dexie.js) によるローカルファースト高速保存、MSAL.js / Microsoft Graph API による OneDrive クラウド同期。
    5. 技術スタック: React + TypeScript + Vite + Tailwind CSS + vite-plugin-pwa。

  【開発・実装原則】
  - 共通化・既存再利用の徹底: 新規作成前に既存実装を調査し、重複定義を避ける。既存機能の小さな拡張で済む場合はそれを最優先する。
  - 原因特定と最小限の修正: バグ修正時、対症療法的な過剰なガード節・安全網を乱造せず、根本原因を特定した上でピンポイントかつ最小限の差分で修正する（検証コードは残さない）。
  - コメントに「Why / Why Not」を残す: コードから自明な処理内容ではなく、なぜこの実装なのか（Why）、なぜ別手法を避けたのか・なぜこのエッジケース対処が必要なのか（Why Not）を明記する。
  - コミットメッセージ: Conventional Commits 簡易版（`<type>: <description>` 形式。スコープやボディは不要）。

